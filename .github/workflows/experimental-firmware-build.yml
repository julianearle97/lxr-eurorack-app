name: Experimental LXR firmware build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/drum1-mono-rumble
      - feature/drum1-mono-rumble-v2
      - feature/drum1-mono-rumble-v3
      - feature/drum1-mono-rumble-v4
      - feature/idm-trigger-engine
      - feature/rumble-bass-v5
      - fix/idm-event-playback-v1561
      - feature/sample-voice-mode-user-wavs
      - fix/sample-mode-hihat-7-voices
      - fix/sample-live-params-names
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi python3
      - name: Run host DSP regression test
        run: |
          cc -O2 -Wall -Wextra -ICore/Inc tests/kick_rumble_host.c Core/Src/Soundengine/DSPAudio/KickRumble.c -lm -o /tmp/lxr-kick-rumble-test
          /tmp/lxr-kick-rumble-test
      - name: Test internal IDM scheduler
        run: |
          cc -std=c11 -Wall -Wextra -ICore/Inc tests/idm_trigger_host.c Core/Src/Soundengine/IdmTriggers.c -o /tmp/idm-test
          /tmp/idm-test
      - name: Test sample mode DSP prototype
        run: |
          cc -O2 -std=c11 -Wall -Wextra -ICore/Inc tests/sample_voice_host.c Core/Src/Soundengine/SampleVoiceBank.c -lm -o /tmp/sample-test
          /tmp/sample-test
      - name: Require user's 12 actual samples before publishing an image
        run: |
          if grep -Fq 'lxr_custom_samples[1]' Core/Src/Soundengine/UserSampleBank.c; then
            echo "::error::Custom sample bank is still an empty placeholder; upload UserSampleBank.c first."
            exit 1
          fi
          grep -Fq 'lxr_custom_sample_offsets[12]' Core/Src/Soundengine/UserSampleBank.c
          grep -Fq 'lxr_custom_sample_lengths[12]' Core/Src/Soundengine/UserSampleBank.c
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Inspect ELF size
        run: |
          find build/release -name '*.elf' -exec arm-none-eabi-size -A {} \;
      - name: Upload experimental firmware image (first hardware test)
        uses: actions/upload-artifact@v4
        with:
          name: lxr-v1.57.2-live-sample-controls-names
          path: build/release/LXRE*.img
          if-no-files-found: error
